services:
  biblia:
    build: .
    container_name: biblia-whatsapp
    # "always" (y no "unless-stopped"): si el daemon de Docker se reinicia
    # o el contenedor muere con exit raro (paso el 21-sep: exit 255 sin
    # reinicio), el contenedor vuelve a levantarse si o si.
    restart: always
    env_file:
      - .env
    volumes:
      # JSONs diarios generados por el scraper (persistentes).
      - ./data:/app/data
      # Sesión de WhatsApp (LocalAuth): claves para no re-escanear QR.
      - ./.wwebjs_auth:/app/.wwebjs_auth
      # Caché de Puppeteer/Chromium.
      - ./.wwebjs_cache:/app/.wwebjs_cache
      # Destinatarios: montamos el DIRECTORIO (no el archivo) para que editar
      # config/recipients.json en el host se vea reflejado sin reiniciar
      # (los mounts de archivo único congelan el inode al reemplazarlo).
      - ./config:/app/config:ro
    # --run-on-start: tras cualquier reinicio (crash, watchdog, exit por envio
    # fallido) reintenta el envio apenas la sesion queda lista. Los restarts
    # del host-watchdog son no-ops si el contenedor ya corre (sin duplicados).
    command: ["node", "src/index.js", "--run-on-start"]
    # node-cron usa TZ del entorno para saber la hora local.
    environment:
      TZ: America/Santiago
      RECIPIENTS_FILE: /app/config/recipients.json
